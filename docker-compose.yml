services:
  inventory:
    build: .
    image: inventory:latest
    container_name: inventory
    restart: unless-stopped
    ports:
      - "4000:4000"
    # APP_PIN and BACKUP_PASSPHRASE come from .env; the rest is fixed for the container.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      PGLITE_DATA_DIR: /data
      BACKUP_DIR: /backups
      WEB_DIST_DIR: /app/packages/web/dist
    volumes:
      - inventory-data:/data
      - inventory-backups:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  inventory-data:
  inventory-backups:
